name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AccountOperations.slnx
      - run: dotnet build AccountOperations.slnx --configuration Release --no-restore
      - run: dotnet test AccountOperations.slnx --configuration Release --no-build
      - name: Build public images
        run: |
          docker build -f Dockerfile .
          docker build -f Dockerfile.resource-manager .
          docker build -f Dockerfile.sharepoint-site-starter .
